<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e8f2fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101a28" media="(prefers-color-scheme: dark)">
<title>Hem</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-maskable-512.png">
<style>
:root{--bg:#e8f2fb;--card:#ffffff;--ink:#1a2433;--mut:#5a6b80;--line:#cfdcea;--acc:#2563d6;--accink:#ffffff;--helg:#ffd84d;--helgink:#3a2c00;--rain:#1f8fd1;
  --c-mat:#f08a24;--c-tv:#6e56cf;--c-vader:#1f8fd1}
@media (prefers-color-scheme:dark){:root{--bg:#101a28;--card:#1a2638;--ink:#eaf1fb;--mut:#9fb1c8;--line:#2b3b52;--acc:#7aa8ff;--accink:#0a1a38;--helg:#e0b92f;--helgink:#241b00;--rain:#7cc4ff;
  --c-mat:#ffb15c;--c-tv:#a995ff;--c-vader:#7cc4ff}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
main{max-width:640px;margin:0 auto;padding:28px 18px 48px}
a{color:inherit}
a:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.dag{margin:6px 0 4px;font-size:.92rem;font-weight:700;color:var(--mut)}
h1{margin:0 0 26px;font-size:clamp(2.4rem,9vw,3.6rem);line-height:1;font-weight:800;letter-spacing:-.02em;color:var(--acc)}

/* Appkorten */
.appar{display:grid;gap:14px}
.app{display:block;text-decoration:none;background:var(--card);border-radius:24px;box-shadow:inset 8px 0 0 var(--dc),0 2px 0 var(--line);padding:20px 20px 20px 26px;transition:transform .12s ease}
.app:active{transform:scale(.985)}
@media (hover:hover){.app:hover{transform:translateY(-2px)}}
.app.mat{--dc:var(--c-mat)} .app.tv{--dc:var(--c-tv)} .app.vader{--dc:var(--c-vader)}
.huvud{display:flex;align-items:center;gap:14px}
.huvud img{width:64px;height:64px;border-radius:50%;flex:none;display:block}
.huvud .namn{flex:1;min-width:0}
.huvud .namn b{display:block;font-size:1.5rem;font-weight:800;line-height:1.15}
.huvud .namn small{display:block;font-size:.85rem;font-weight:700;color:var(--mut)}
.pil{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);color:var(--ink);flex:none}
.pil svg{width:20px;height:20px}
</style>
</head>
<body>
<main>
  <p class="dag" id="dag"></p>
  <h1 id="halsning">Hej!</h1>

  <nav class="appar" aria-label="Mina appar">
    <a class="app mat" href="https://tomas-m-andersson.github.io/mat/">
      <div class="huvud">
        <img src="https://tomas-m-andersson.github.io/mat/icon-192.png" alt="">
        <div class="namn"><b>Mat</b><small>Veckomeny, inköp och recept</small></div>
        <span class="pil" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span>
      </div>
    </a>

    <a class="app tv" href="https://tomas-m-andersson.github.io/tv/">
      <div class="huvud">
        <img src="https://tomas-m-andersson.github.io/tv/icon-192.png" alt="">
        <div class="namn"><b>TV</b><small>Filmer och serier att se</small></div>
        <span class="pil" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span>
      </div>
    </a>

    <a class="app vader" href="https://tomas-m-andersson.github.io/vader/">
      <div class="huvud">
        <img src="https://tomas-m-andersson.github.io/vader/icon-192.png" alt="">
        <div class="namn"><b>Väder</b><small>Prognos för dina orter</small></div>
        <span class="pil" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span>
      </div>
    </a>
  </nav>

</main>

<script>
(function(){
  var pad = function(n){ return String(n).padStart(2,'0'); };
  var DAGAR = ['Söndag','Måndag','Tisdag','Onsdag','Torsdag','Fredag','Lördag'];
  var nu = new Date(), h = nu.getHours();
  document.getElementById('dag').textContent = DAGAR[nu.getDay()] + ' ' + nu.getFullYear() + '-' + pad(nu.getMonth()+1) + '-' + pad(nu.getDate());
  document.getElementById('halsning').textContent = h < 5 ? 'God natt!' : h < 10 ? 'God morgon!' : h < 17 ? 'Hej!' : 'God kväll!';
})();
</script>
</body>
</html>
